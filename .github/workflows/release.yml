name: Release

# The downloads: `cmake --workflow --preset release` on Windows (MinGW) and
# Linux builds, tests and packs Loupe with every autana demo scene as a sample,
# then each archive is unpacked and smoke-rendered on a PATH holding nothing.
# Every pull request and push to main runs it; a tag v<project version>, or
# v<project version>-<pre-release> for a pre-release, also publishes the
# archives as that tag's GitHub Release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

# build_pack.py fetches the bakes autana's lock names from its public release.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  version:
    name: The tag names the project version
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag against project(loupe VERSION)
        run: |
          version=$(sed -n 's/^project(loupe VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          case "$GITHUB_REF_NAME" in
          "v$version" | "v$version"-?*) echo "$GITHUB_REF_NAME releases loupe $version" ;;
          *) echo "::error::tag $GITHUB_REF_NAME is not v$version, the version in CMakeLists.txt"; exit 1 ;;
          esac

  package:
    name: ${{ matrix.name }}
    needs: version
    # Runs when the version job passed or, off a tag, was skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
          - name: Windows (MinGW)
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: third_party/autana/.python-version
      - name: Build tools
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Linux packages
        if: ${{ runner.os == 'Linux' }}
        run: tools/ci/install-linux-packages.sh
      - name: Build, test and pack
        run: cmake --workflow --preset release
      - name: Every sample renders from the unpacked archive, with nothing on PATH
        run: |
          for archive in build/release/loupe-*.zip build/release/loupe-*.tar.gz; do
              [ -f "$archive" ] || continue
              tools/ci/package_smoke.sh "$archive" "$RUNNER_TEMP/smoke"
              ls -l "$archive"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loupe-${{ runner.os }}
          path: |
            build/release/loupe-*.zip
            build/release/loupe-*.tar.gz
          if-no-files-found: error
      - name: Upload the smoke renders
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke/renders
          if-no-files-found: ignore

  publish:
    name: GitHub Release
    needs: package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loupe-*
          merge-multiple: true
          path: dist
      - name: Release ${{ github.ref_name }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Loupe ${GITHUB_REF_NAME#v}" --generate-notes $pre
