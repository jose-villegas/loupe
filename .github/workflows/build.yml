name: Build

# Loupe built and tested on Linux and on Windows with MinGW, the compilers
# autana's host builds use: at the autana pin on every pull request, and
# against autana's main when the nightly calls it with autana-ref.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      autana-ref:
        description: An autana branch to build against instead of the pin
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.autana-ref }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# build_pack.py fetches the bakes autana's lock names from its public release.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
          - name: Windows (MinGW)
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - name: Autana at ${{ inputs.autana-ref }}
        if: ${{ inputs.autana-ref != '' }}
        run: |
          git -C third_party/autana fetch --depth 1 origin "${{ inputs.autana-ref }}"
          git -C third_party/autana checkout --detach FETCH_HEAD
          git -C third_party/autana log --oneline -1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: third_party/autana/.python-version
      - name: Build tools
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Linux packages
        if: ${{ runner.os == 'Linux' }}
        run: tools/ci/install-linux-packages.sh
      - name: Build and test
        run: cmake --workflow --preset default
      # Also run before a push that changes C++ or CMake (README, Standards).
      - name: Build and test under the sanitizers
        env:
          PUSH_TEST_GATE: "true"
        run: cmake --workflow --preset sanitize
      - name: Upload the renders
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: renders-${{ matrix.runs-on }}
          path: |
            build/*/tests/parity_*
            build/*/packs/*/build_pack.log
          if-no-files-found: ignore
