name: Build

# Loupe built and tested on Linux and on Windows with MinGW, the compilers
# autana's host builds use: at the autana pin on every pull request, and
# against autana's main when the nightly calls it with autana-ref. Each run
# also builds the downloads and renders every sample from them; a tag
# v<version>, or v<version>-<pre-release> for a pre-release, publishes them as
# that tag's GitHub Release.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      autana-ref:
        description: An autana branch to build against instead of the pin
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.autana-ref }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# build_pack.py fetches the bakes autana's lock names from its public release.
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runs-on: ubuntu-24.04
          - name: Windows (MinGW)
            runs-on: windows-2025
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - name: Autana at ${{ inputs.autana-ref }}
        if: ${{ inputs.autana-ref != '' }}
        run: |
          git -C third_party/autana fetch --depth 1 origin "${{ inputs.autana-ref }}"
          git -C third_party/autana checkout --detach FETCH_HEAD
          git -C third_party/autana log --oneline -1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: third_party/autana/.python-version
      - name: Build tools
        run: python -m pip install -r tools/ci/requirements.txt
      - name: Linux packages
        if: ${{ runner.os == 'Linux' }}
        run: tools/ci/install-linux-packages.sh
      - name: Build and test
        run: cmake --workflow --preset default
      # Also run before a push that changes C++ or CMake (README, Standards).
      # Built without the pack tool, so it proves loupe opens .apak files alone.
      - name: Build and test under the sanitizers, without the pack tool
        env:
          PUSH_TEST_GATE: "true"
        run: cmake --workflow --preset sanitize
      # cpack's NSIS generator makes the Windows installer. The runner has no
      # NSIS, so this one, checked by its SHA-256, is the one on PATH.
      - name: NSIS
        if: ${{ runner.os == 'Windows' }}
        run: |
          # NSIS 3.13
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nsis.zip" https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip
          echo "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8  $RUNNER_TEMP/nsis.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/nsis.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/nsis-3.13" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nsis-3.13/makensis.exe" -VERSION
      # The downloads: optimized, without the pack tool, every autana demo scene
      # as a sample; then each is unpacked and every sample rendered from it.
      - name: Build, test and pack the downloads
        run: cmake --workflow --preset release
      - name: Every sample renders from the unpacked download, with nothing on PATH
        run: |
          for archive in build/release/loupe-*.zip build/release/loupe-*.tar.gz; do
              [ ! -f "$archive" ] || tools/ci/package_smoke.sh "$archive" "$RUNNER_TEMP/smoke"
          done
      - name: The installer installs, renders every sample, and uninstalls without a trace
        if: ${{ runner.os == 'Windows' }}
        run: tools/ci/installer_smoke.sh build/release/loupe-*-windows-setup.exe "$RUNNER_TEMP/installer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loupe-${{ runner.os }}
          path: |
            build/release/loupe-*.zip
            build/release/loupe-*.exe
            build/release/loupe-*.tar.gz
          if-no-files-found: error
      - name: Upload the renders
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renders-${{ matrix.runs-on }}
          path: |
            build/*/tests/parity_*
            build/*/packs/*/build_pack.log
            ${{ runner.temp }}/smoke/renders
            ${{ runner.temp }}/installer/smoke/renders
          if-no-files-found: ignore

  publish:
    name: GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loupe-*
          merge-multiple: true
          path: dist
      # CPack names the files by the project version, so the tag must name it too.
      - name: Release ${{ github.ref_name }}
        run: |
          version=${GITHUB_REF_NAME#v}
          version=${version%%-*}
          if ! ls dist/loupe-"$version"-* >/dev/null 2>&1; then
              echo "::error::tag $GITHUB_REF_NAME does not name the version of the downloads: $(ls dist)"
              exit 1
          fi
          pre=
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Loupe ${GITHUB_REF_NAME#v}" --generate-notes $pre
