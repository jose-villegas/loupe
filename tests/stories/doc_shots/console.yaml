# The Console on the capybara scene, filtered to the line its opening logs,
# which Copy puts on the clipboard.
- name: The capybara scene
  loupe.open: ../../../third_party/autana/launcher/demo/capybara/capybara.scene.toml --dt 100
- name: The Console, from its shortcut
  loupe.key: ctrl+shift+c
- loupe.uncheck: //Console/Time
- loupe.input: {ref: "//Console/Filter", value: "opened"}
- loupe.click: //Console/Copy
- name: The opening line shown
  loupe.clipboard: "[loupe] opened capybara from capybara.scene.toml"
- loupe.screenshot: {out: console.png, crop: Console}
