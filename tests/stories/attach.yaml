# A board's live view, end to end, as a person reaches it: autana puts the
# board on render_lab's Sponza, then the window lists the boards, views
# ${BOARD} live, sees frames keep coming, records a stretch, stops, and goes
# back to the scenes once the board's stream has drained.
#
# It needs the board, so it runs where the board is free to it, with the
# board's development firmware built from the autana Loupe pins:
#   loupe-storyboard --recipe tests/stories/attach.yaml --set BOARD=<serial> -o DIR
- name: The board in render_lab
  loupe.autana: [open, Render Lab]
- name: Sponza asked for
  loupe.autana: render scene sponza
- name: Sponza showing
  loupe.autana:
    args: render scenes
    until: "scene=sponza name=[^\\n]* current=1"
    timeout_s: 60

- name: The boards listed
  loupe.click: "//loupe/List boards"
- loupe.wait: {until: [{loupe.boards: ~, match: "${BOARD}"}], timeout_s: 60}
- name: View pressed
  loupe.click: "//loupe/${BOARD}/View"
- name: The live view's first frame
  loupe.wait: {until: [{loupe.phase: ~, eq: Shown}], timeout_s: 60}
  check: [{loupe.screen: ~, eq: live}, {loupe.refusal: ~, eq: ""}]
- name: Frames keep coming
  loupe.wait: {while: [{loupe.phase: ~, eq: Shown}, {loupe.frame_age_s: ~, lt: 1}], for_s: 10}
- loupe.screenshot: live.png

- name: Record pressed
  loupe.click: "//Frame debugger/board/Record"
- loupe.wait: {until: [{loupe.saving: ~, eq: saving}, {loupe.saved_frames: ~, gt: 30}], timeout_s: 30}
- name: Recording stopped
  loupe.click: "//Frame debugger/board/Stop recording"
- loupe.wait: {until: [{loupe.saving: ~, eq: "off"}], timeout_s: 10}
  check: [{loupe.recording: ~, match: "\\.framerec$"}, {loupe.recording_bytes: ~, gt: 0}]

- name: Back to the scenes, the board's stream drained
  loupe.click: "//Frame debugger/Scenes"
- loupe.wait: {until: [{loupe.screen: ~, eq: start}], timeout_s: 60}
